<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UCO Kudos - Mi perfil</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header>
    <h1>UCO Kudos</h1>
    <nav id="menu"></nav>
  </header>

  <main>
    <section class="tarjeta">
      <h2>Mi información</h2>
      <p id="datosCuenta" class="ayuda"></p>
      <form id="formPerfil">
        <label for="nombres">Nombres</label>
        <input type="text" id="nombres" required>
        <label for="apellidos">Apellidos</label>
        <input type="text" id="apellidos" required>
        <label for="correo">Correo institucional</label>
        <input type="email" id="correo" required>
        <label for="celular">Número celular (+57)</label>
        <input type="text" id="celular" maxlength="10" required>
        <p class="ayuda">Si cambias el correo o el celular, tendrás que verificarlo de nuevo y tu cuenta quedará pendiente hasta hacerlo.</p>
        <button type="submit">Guardar cambios</button>
      </form>
      <div id="mensaje" class="mensaje oculto"></div>
    </section>
  </main>

  <script src="js/sesion.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/perfil.js"></script>
</body>
</html>
