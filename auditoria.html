<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UCO Kudos - Auditoría</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header>
    <h1>UCO Kudos</h1>
    <nav id="menu"></nav>
  </header>

  <main>
    <section class="tarjeta">
      <h2>Auditoría</h2>
      <form id="formFiltro" class="formulario-linea">
        <label for="accion">Acción</label>
        <input type="text" id="accion" placeholder="ej. KUDO_CREADO">
        <label for="entidad">Entidad</label>
        <input type="text" id="entidad" placeholder="ej. Kudo">
        <button type="submit">Filtrar</button>
      </form>
      <div id="mensaje" class="mensaje oculto"></div>
    </section>
    <table>
      <thead><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Entidad</th><th>Antes</th><th>Después</th></tr></thead>
      <tbody id="tablaAuditoria"></tbody>
    </table>
  </main>

  <script src="js/sesion.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/auditoria.js"></script>
</body>
</html>
